services:
  quant-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: quant-web:latest
    container_name: quant-web
    restart: unless-stopped
    ports:
      - "3111:3111"
    environment:
      TZ: Asia/Shanghai
      PYTHON_BIN: /opt/venv/bin/python
      WEB_DATA_DIR: /app/data
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set}"
      DATABASE_SSL_REJECT_UNAUTHORIZED: "${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}"
      DATABASE_POOL_MAX: "${DATABASE_POOL_MAX:-5}"
      TUSHARE_TOKEN: "${TUSHARE_TOKEN:-}"
      WECHAT_WEBHOOK_URL: "${WECHAT_WEBHOOK_URL:-}"
      SIGNAL_WEBHOOK_URL: "${SIGNAL_WEBHOOK_URL:-}"
      SIGNAL_WEBHOOK_AUTH: "${SIGNAL_WEBHOOK_AUTH:-}"
      SIGNAL_EMAIL_SENDER: "${SIGNAL_EMAIL_SENDER:-}"
      SIGNAL_EMAIL_PASSWORD: "${SIGNAL_EMAIL_PASSWORD:-}"
      SIGNAL_EMAIL_RECEIVER: "${SIGNAL_EMAIL_RECEIVER:-}"
      SIGNAL_BARK_DEVICE_KEY: "${SIGNAL_BARK_DEVICE_KEY:-}"
      BACKTEST_ENABLED: "${BACKTEST_ENABLED:-0}"
    volumes:
      # Web 控制台数据库（模型/策略/推送/定时/股票池等全部配置）
      - quant-data:/app/data
      # Python 信号库状态（signal_monitor.db：候选池、事件去重、outbox、全市场初始化进度）。
      # 必须挂在独立的 state/ 目录：signal_system/data 是 Python 源码包目录，不能挂卷覆盖，
      # 否则镜像内的 market_data.py 等模块会被已有卷内容遮蔽导致导入失败。
      - quant-signal-data:/app/signal_system/state
      # 分析/扫描结果 JSON
      - quant-output:/app/signal_system/output
      # 行情缓存与日志（可清空，丢失后会自动重建）
      - quant-cache:/app/signal_system/cache
      - quant-logs:/app/signal_system/logs

  # 全市场回测的独立消费者：单独进程执行，不占用 web 的调度器与分析/扫描锁。
  quant-backtest:
    image: quant-web:latest
    container_name: quant-backtest
    working_dir: /app/web
    command: ["npm", "run", "backtest:worker"]
    init: true
    restart: unless-stopped
    # 镜像自带的是 HTTP 健康检查，worker 不监听端口，必须显式关闭。
    healthcheck:
      disable: true
    cpus: "${BACKTEST_CPUS:-1.0}"
    mem_limit: "${BACKTEST_MEMORY_LIMIT:-2g}"
    environment:
      TZ: Asia/Shanghai
      PYTHON_BIN: /opt/venv/bin/python
      WEB_DATA_DIR: /app/data
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set}"
      DATABASE_SSL_REJECT_UNAUTHORIZED: "${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}"
      DATABASE_POOL_MAX: "${DATABASE_POOL_MAX:-5}"
      TUSHARE_TOKEN: "${TUSHARE_TOKEN:-}"
      BACKTEST_ENABLED: "${BACKTEST_ENABLED:-0}"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      # 与 web 共用同一 output 目录：报告的 output_dir 在两个容器内路径一致。
      - quant-output:/app/signal_system/output
      # 独立缓存与日志：不挂实盘 state，也不与 web 的扫描缓存互抢。
      - quant-backtest-cache:/app/signal_system/cache
      - quant-backtest-logs:/app/signal_system/logs

volumes:
  quant-data:
  quant-signal-data:
  quant-output:
  quant-cache:
  quant-logs:
  quant-backtest-cache:
  quant-backtest-logs:
