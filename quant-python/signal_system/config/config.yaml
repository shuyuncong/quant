# A股缠论多周期信号监控配置（含量化交易信号系统统一配置）

market_data:
  provider: "auto"                 # auto=腾讯K线+新浪/东方财富列表；也可选 eastmoney/akshare/tushare
  tushare_token: "${TUSHARE_TOKEN:-}"
  adjust: "none"                   # 默认不复权以保证腾讯日线/分钟线口径一致
  min_listing_trade_days: 120      # 全市场扫描排除上市不足该交易日数的股票
  minute_timestamp: "end"
  volume_unit_shares: 100           # AkShare A股成交量通常以“手”为单位
  use_cache: true
  cache_dir: "./cache"
  request_interval_seconds: 0.35

# 兼容旧版 signal_system 的数据源配置
data_source:
  tushare_token: "${TUSHARE_TOKEN:-}"
  use_cache: true
  cache_dir: "./cache"
  request_interval_seconds: 0.35

# 新版统一数据层配置
data:
  provider: "akshare"
  minute_provider: "pytdx"
  fallback_provider: ""
  minute_fallback_provider: ""
  disable_system_proxy: true
  request_workers: 4
  cache_dir: "./cache"
  daily_cache_hours: 24
  minute_cache_hours: 6
  fundamentals_cache_hours: 168
  pytdx_host: "180.153.18.170"
  pytdx_port: 7709
  pytdx_hosts:
    - "180.153.18.170:7709"
    - "119.147.212.81:7709"
    - "114.80.63.12:7709"

strategy:
  fundamental:
    min_roe: 10
    max_debt_ratio: 60
    max_pe: 30
    min_market_cap: 50
    max_market_cap: 3000

  technical:
    ma_period: 250
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    ma250_distance_threshold: 0.05

  volume:
    # StockSelector fundamentals/turnover defaults are sourced from strategy.volume.
    # Keep turnover and volume-burst thresholds here as the single source of truth.
    min_turnover_rate: 0.5
    max_turnover_rate: 5
    volume_burst_ratio: 0.8

  enabled:
    trend_following: true
    mean_reversion: false
    breakout: false

  minute_frames: [5, 30, 60]
  candidate_pool_size: 30

signal_strategy:
  macd:
    fast: 12
    slow: 26
    signal: 9
    zero_axis_tolerance: 0.005       # DIF/DEA 距0轴不超过收盘价的0.5%
    moderate_volume_min: 1.0         # 温和放量下限：当日量/20日均量
    moderate_volume_max: 2.0         # 温和放量上限，避免把异常巨量当作温和放量
    pullback_confirmation_bars: 5    # 金叉后最多等待5根已收盘K线回落确认
    min_confirmations: 0             # 默认不设确认条件数门槛，保留为可调实验参数
    long_ma_period: 250              # 日线长期趋势/年线
    position_lookback: 20            # 近期涨幅风险窗口
    max_long_ma_distance: 0.35       # 距年线超过35%标记高位风险
    max_recent_return: 0.30           # 20日涨幅超过30%标记高位风险
    high_position_volume_ratio: 3.0  # 高位量比达到3倍以上标记诱多风险
  llm_context_bars: 48               # 每周期保留给报告和AI解读的近期K线数
  chan:
    min_bi_bars: 4
    divergence_ratio: 0.90          # 当前同向笔MACD面积小于前一笔的90%
    fresh_signal_bars: 1            # 只推最新已完成K线确认的结构
  execution_policy:
    default: "enabled"              # 未单独配置的入场信号保持原有行为
    signals:
      buy_1: "enabled"
      buy_2: "observe_only"         # 继续识别/记录/展示，但不作为独立入场依据
      buy_3: "enabled"
      macd_golden_cross_pullback_confirmed_above: "enabled"
      macd_golden_cross_pullback_confirmed_near: "enabled"
    by_regime:                      # 按市场状态覆盖信号执行模式（建议仅收紧）
      bull:
        macd_golden_cross_pullback_confirmed_above: "enabled"
        buy_2: "observe_only"       # buy_2 只作实验变量，默认不在牛市启用
      range:
        macd_golden_cross_pullback_confirmed_above: "observe_only"
        buy_2: "observe_only"
      bear:
        macd_golden_cross_pullback_confirmed_above: "observe_only"
        buy_2: "observe_only"
  scoring:
    buy_threshold: 60
    sell_threshold: 60
    timeframe_weights:
      1m: 1
      5m: 2
      15m: 3
      30m: 4
      60m: 5
      120m: 6
      1d: 8

selector:
  # selector only keeps structure-specific tuning.
  # fundamental and turnover thresholds inherit from strategy.fundamental / strategy.volume.
  pe_excellent_max: 17
  near_ma_threshold: 0.05
  price_change_soft_min: -0.03
  price_change_soft_max: 0.03

# MACD 主扫描与回测共用的前置股票池。金额单位见字段注释。
stock_pool:
  enabled: true
  min_market_cap: 50               # 信号当日流通市值下限，亿元
  max_market_cap: 3000             # 信号当日流通市值上限，亿元
  amount_window: 20                # 平均成交额统计窗口，交易日
  min_avg_amount: 1.0              # 最低平均成交额，亿元
  turnover_window: 20              # 平均换手率统计窗口，交易日
  min_avg_turnover_rate: 0.5       # 最低平均换手率，百分比
  max_avg_turnover_rate: 8.0       # 最高平均换手率，百分比
  min_listing_trade_days: 120      # 上市后至少经过的交易日数
  exclude_st: true
  exclude_delisting: true
  missing_data_policy: "reject"    # reject=缺指标拒绝；allow=记录警告后放行

entry_filters:
  market_gate_enabled: true         # 日线候选必须通过指数状态闸门
  market_index_code: "000001.SH"
  market_gate_fail_open: false      # 指数数据不可用时不新增候选
  trend_gate_enabled: true          # 大盘 MA20/MA60 趋势闸门：快线高于慢线才允许开仓
  trend_fast_ma: 20
  trend_slow_ma: 60
  fast_gate_mode: "ma10_latch"       # 快速闸门: none | ma10_latch | macd_death_latch | any_latch
  position_gate_enabled: true       # 日线候选要求站在上行长期均线之上

regime:
  mode: "auto"
  index_code: "000001.SH"
  ma_short: 20
  ma_long: 250
  slope_window: 20
  lookback_bars: 300
  bull_score_threshold: 0.70
  bear_score_threshold: 0.70
  range_score_threshold: 0.60

position:
  min_stocks: 2
  target_stocks: 3
  max_stocks: 4
  base_position_per_stock: 0.25
  mobile_cash_ratio: 0.25
  max_position_per_stock: 0.40

risk:
  stop_loss_pct: 0.08
  stop_profit_pct: 0.30
  long_holding_days_threshold: 40
  long_holding_stop_loss_multiplier: 1.25
  long_holding_stop_profit_multiplier: 1.10
  high_volatility_threshold_pct: 0.35
  high_volatility_stop_loss_multiplier: 1.20
  high_volatility_stop_profit_multiplier: 1.10
  max_portfolio_drawdown_pct: 0.20
  max_single_day_drawdown_pct: 0.02
  allow_new_position_when_drawdown_exceeded: false

t_trading:
  enabled: true
  positive_t_step_pct: 0.05
  negative_t_step_pct: 0.05
  range_t_step_pct: 0.05

backtest:
  initial_cash: 100000
  adjustment: "qfq"                # 回测独立使用前复权，不改变实时分钟线口径
  history_bars: 800                 # MA250 之前保留足够预热历史
  fetch_missing_adjusted: true      # 缺少/过短 QFQ 缓存时主动拉取，禁止回退 none
  commission_pct: 0.0003
  minimum_commission: 5.0           # 券商每笔佣金最低5元
  stamp_tax_pct: 0.001
  slippage_pct: 0.0005
  lot_size: 100
  t_plus_one: true
  price_limit_model: "conservative"
  st_symbols: []                    # 需手工维护历史ST代码；配置后按5%涨跌停
  intrabar_conflict: "stop_first"   # 日线无法判断高低点先后，止损优先更保守
  market_gate_slope_bars: 5         # MA250 与5根K线前比较，和实时扫描一致
  signal_priority:
    - "macd_golden_cross_pullback_confirmed_above"
    - "macd_golden_cross_pullback_confirmed_near"
    - "buy_1"
    - "buy_2"
    - "buy_3"
  chan_zero_axis:
    allowed_zones: ["above", "near"]
    min_confirmations: 0
    cross_window_bars: 5
    max_holding_bars: 40

manual_overrides:
  regime_override: "auto"
  regime_override_reason: ""
  disable_new_positions: false
  only_reduce_positions: false
  max_total_exposure: 1.0
  watchlist_only: []

# 兼容旧版 signal_system 的风控结构
risk_control:
  position:
    max_total_position: 0.8
    max_single_position: 0.25
    reserve_cash_ratio: 0.25
  market_position:
    bull_market: 0.8
    sideways_market: 0.5
    range_market: 0.5
    bear_market: 0.2
  stop_loss: 0.08
  stop_profit: 0.30
  max_drawdown: 0.15

monitor:
  watchlist:
    - "000001.SZ"
    - "600036.SH"
  timeframes: ["1m", "5m", "15m", "30m", "60m", "120m", "1d"]
  bar_limit: 300
  interval_seconds: 60
  daily_scan_time: "04:00"
  candidate_limit: 100
  candidate_ttl_business_days: 5
  max_scan_symbols_per_run: 500
  max_symbols_per_cycle: 20          # 盘中分批轮询，避免100只股票×多周期超过监控间隔

scan:
  universe_mode: "all_a"            # watchlist / all_a

notification:
  timeout_seconds: 10
  wechat:
    enabled: false
    webhook_url: "${WECHAT_WEBHOOK_URL:-}"
  webhook:
    enabled: false
    url: "${SIGNAL_WEBHOOK_URL:-}"
    headers:
      Authorization: "${SIGNAL_WEBHOOK_AUTH:-}"
  email:
    enabled: false
    smtp_server: "smtp.qq.com"
    smtp_port: 465
    sender: "${SIGNAL_EMAIL_SENDER:-}"
    password: "${SIGNAL_EMAIL_PASSWORD:-}"
    receiver: "${SIGNAL_EMAIL_RECEIVER:-}"
  bark:
    enabled: false
    url: "https://api.day.app/push"
    device_key: "${SIGNAL_BARK_DEVICE_KEY:-}"
  channels: ["wecom", "email", "bark"]
  push_market_regime: true
  push_candidate_pool: true
  push_trade_signal: true
  push_ai_analysis: true

runtime:
  database_path: "./state/signal_monitor.db"
  output_dir: "./output"
  schedule:
    daily_scan_time: "04:00"
    weekly_review_day: "Friday"
  logging:
    level: "INFO"
    file: "./logs/signal_monitor.log"
  database:
    enabled: false
    type: "sqlite"
    path: "./state/signals.db"
