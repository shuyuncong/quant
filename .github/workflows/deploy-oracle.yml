name: Deploy to Oracle

on:
  push:
    branches: [master]
    # 只有应用代码/构建相关文件变化才触发部署，文档类提交不重建
    paths:
      - "quant-python/Dockerfile"
      - "quant-python/docker-compose*.yml"
      - "quant-python/web/**"
      - "quant-python/signal_system/**"
      - "quant-python/core/**"
      - "quant-python/backtest/**"
      # deploy 脚本/工作流自身变更也触发：否则服务器 /home/ubuntu/ops/deploy-quant.sh
      # 永远停在旧版（GHA 用旧脚本部署，旧脚本不会同步自己）——本仓库曾因此
      # 在切换自建库后用旧脚本重建 web、丢失 internal 网络。
      - "docs/ops/deploy-quant.sh"
      - ".github/workflows/deploy-oracle.yml"

concurrency:
  # 同一时间只允许一个部署任务，避免并发 pull/build 冲突
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger remote deploy script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          # 若 authorized_keys 里配置了 command= 强制命令，这里的 script 会被忽略，
          # 一律执行服务器上的 /home/ubuntu/ops/deploy-quant.sh
          script: |
            /home/ubuntu/ops/deploy-quant.sh
