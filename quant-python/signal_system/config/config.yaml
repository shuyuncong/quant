# A股缠论多周期信号监控配置（含量化交易信号系统统一配置）

market_data:
  provider: "auto"                 # auto=腾讯K线+新浪/东方财富列表；也可选 eastmoney/akshare/tushare
  tushare_token: "${TUSHARE_TOKEN:-}"
  adjust: "none"                   # 默认不复权以保证腾讯日线/分钟线口径一致
  min_listing_trade_days: 120      # 全市场扫描排除上市不足该交易日数的股票
  minute_timestamp: "end"
  volume_unit_shares: 100           # AkShare A股成交量通常以“手”为单位
  use_cache: true
  cache_dir: "./cache"
  request_interval_seconds: 0.35

# 兼容旧版 signal_system 的数据源配置
data_source:
  tushare_token: "${TUSHARE_TOKEN:-}"
  use_cache: true
  cache_dir: "./cache"
  request_interval_seconds: 0.35

# 新版统一数据层配置
data:
  provider: "akshare"
  minute_provider: "pytdx"
  fallback_provider: ""
  minute_fallback_provider: ""
  disable_system_proxy: true
  request_workers: 4
  cache_dir: "./cache"
  daily_cache_hours: 24
  minute_cache_hours: 6
  fundamentals_cache_hours: 168
  pytdx_host: "180.153.18.170"
  pytdx_port: 7709
  pytdx_hosts:
    - "180.153.18.170:7709"
    - "119.147.212.81:7709"
    - "114.80.63.12:7709"

strategy:
  fundamental:
    min_roe: 10
    max_debt_ratio: 60
    max_pe: 30
    min_market_cap: 50
    max_market_cap: 3000

  technical:
    ma_period: 250
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    ma250_distance_threshold: 0.05

  volume:
    # StockSelector fundamentals/turnover defaults are sourced from strategy.volume.
    # Keep turnover and volume-burst thresholds here as the single source of truth.
    min_turnover_rate: 0.5
    max_turnover_rate: 5
    volume_burst_ratio: 0.8

  enabled:
    trend_following: true
    mean_reversion: false
    breakout: false

  minute_frames: [5, 30, 60]
  candidate_pool_size: 30

signal_strategy:
  macd:
    fast: 12
    slow: 26
    signal: 9
    zero_axis_tolerance: 0.005       # DIF/DEA 距0轴不超过收盘价的0.5%
    moderate_volume_min: 1.0         # 温和放量下限：当日量/20日均量
    moderate_volume_max: 2.0         # 温和放量上限，避免把异常巨量当作温和放量
  llm_context_bars: 48               # 每周期保留给报告和AI解读的近期K线数
  chan:
    min_bi_bars: 4
    divergence_ratio: 0.90          # 当前同向笔MACD面积小于前一笔的90%
    fresh_signal_bars: 1            # 只推最新已完成K线确认的结构
  scoring:
    buy_threshold: 60
    sell_threshold: 60
    timeframe_weights:
      1m: 1
      5m: 2
      15m: 3
      30m: 4
      60m: 5
      120m: 6
      1d: 8

selector:
  # selector only keeps structure-specific tuning.
  # fundamental and turnover thresholds inherit from strategy.fundamental / strategy.volume.
  pe_excellent_max: 17
  near_ma_threshold: 0.05
  price_change_soft_min: -0.03
  price_change_soft_max: 0.03

regime:
  mode: "auto"
  index_code: "000001.SH"
  ma_short: 20
  ma_long: 250
  slope_window: 20
  lookback_bars: 300
  bull_score_threshold: 0.70
  bear_score_threshold: 0.70
  range_score_threshold: 0.60

position:
  min_stocks: 2
  target_stocks: 3
  max_stocks: 4
  base_position_per_stock: 0.25
  mobile_cash_ratio: 0.25
  max_position_per_stock: 0.40

risk:
  stop_loss_pct: 0.08
  stop_profit_pct: 0.30
  long_holding_days_threshold: 40
  long_holding_stop_loss_multiplier: 1.25
  long_holding_stop_profit_multiplier: 1.10
  high_volatility_threshold_pct: 0.35
  high_volatility_stop_loss_multiplier: 1.20
  high_volatility_stop_profit_multiplier: 1.10
  max_portfolio_drawdown_pct: 0.20
  max_single_day_drawdown_pct: 0.02
  allow_new_position_when_drawdown_exceeded: false

t_trading:
  enabled: true
  positive_t_step_pct: 0.05
  negative_t_step_pct: 0.05
  range_t_step_pct: 0.05

backtest:
  initial_cash: 100000
  commission_pct: 0.0003
  stamp_tax_pct: 0.001
  slippage_pct: 0.0005
  lot_size: 100
  t_plus_one: true
  price_limit_model: "conservative"
  chan_zero_axis:
    allowed_zones: ["above", "near"]
    min_confirmations: 2
    cross_window_bars: 5
    max_holding_bars: 40

manual_overrides:
  regime_override: "auto"
  regime_override_reason: ""
  disable_new_positions: false
  only_reduce_positions: false
  max_total_exposure: 1.0
  watchlist_only: []

# 兼容旧版 signal_system 的风控结构
risk_control:
  position:
    max_total_position: 0.8
    max_single_position: 0.25
    reserve_cash_ratio: 0.25
  market_position:
    bull_market: 0.8
    sideways_market: 0.5
    range_market: 0.5
    bear_market: 0.2
  stop_loss: 0.08
  stop_profit: 0.30
  max_drawdown: 0.15

monitor:
  watchlist:
    - "000001.SZ"
    - "600036.SH"
  timeframes: ["1m", "5m", "15m", "30m", "60m", "120m", "1d"]
  bar_limit: 300
  interval_seconds: 60
  daily_scan_time: "15:20"
  candidate_limit: 100
  candidate_ttl_business_days: 5
  max_scan_symbols_per_run: 500
  max_symbols_per_cycle: 20          # 盘中分批轮询，避免100只股票×多周期超过监控间隔

scan:
  universe_mode: "all_a"            # watchlist / all_a

notification:
  timeout_seconds: 10
  wechat:
    enabled: false
    webhook_url: "${WECHAT_WEBHOOK_URL:-}"
  webhook:
    enabled: false
    url: "${SIGNAL_WEBHOOK_URL:-}"
    headers:
      Authorization: "${SIGNAL_WEBHOOK_AUTH:-}"
  email:
    enabled: false
    smtp_server: "smtp.qq.com"
    smtp_port: 465
    sender: "${SIGNAL_EMAIL_SENDER:-}"
    password: "${SIGNAL_EMAIL_PASSWORD:-}"
    receiver: "${SIGNAL_EMAIL_RECEIVER:-}"
  bark:
    enabled: false
    url: "https://api.day.app/push"
    device_key: "${SIGNAL_BARK_DEVICE_KEY:-}"
  channels: ["wecom", "email", "bark"]
  push_market_regime: true
  push_candidate_pool: true
  push_trade_signal: true
  push_ai_analysis: true

runtime:
  database_path: "./data/signal_monitor.db"
  output_dir: "./output"
  schedule:
    daily_scan_time: "15:30"
    weekly_review_day: "Friday"
  logging:
    level: "INFO"
    file: "./logs/signal_monitor.log"
  database:
    enabled: false
    type: "sqlite"
    path: "./data/signals.db"
